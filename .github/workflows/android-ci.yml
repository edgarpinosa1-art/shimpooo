name: Android CI & APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test Gizmooh Downloader
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Configure Maven Central mirror fallback
        run: |
          cat <<'EOF' > "${{ runner.temp }}/ci-init.gradle"
          beforeSettings { settings ->
              settings.dependencyResolutionManagement {
                  repositories {
                      maven {
                          url = uri("https://maven-central.storage-download.googleapis.com/maven2")
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: |
          for attempt in 1 2 3; do
            if gradle --init-script "${{ runner.temp }}/ci-init.gradle" :app:assembleDebug --no-daemon --max-workers=2 --stacktrace; then
              exit 0
            fi
            echo "Build attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Run unit tests
        run: |
          for attempt in 1 2 3; do
            if gradle --init-script "${{ runner.temp }}/ci-init.gradle" :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace; then
              exit 0
            fi
            echo "Test attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          exit 1

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GizmoohDownloader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check optional release signing secrets
        id: release_signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APK & AAB (Optional)
        if: steps.release_signing.outputs.enabled == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_PATH"
          gradle --init-script "${{ runner.temp }}/ci-init.gradle" :app:assembleRelease :app:bundleRelease --no-daemon --max-workers=2 --stacktrace

      - name: Upload Release APK & AAB artifacts (Optional)
        if: steps.release_signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GizmoohDownloader-release-outputs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30
